name: Weekly report

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC, which is 9:00 in Boston during daylight time
    - cron: "17 * * * *"   # SPIKE ONLY: hourly at :17, off the top-of-hour peak
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run marimo export html report.py -o docs/index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Weekly report" || echo "Nothing changed"
          git push
